name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  build-n-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check that versions are in sync
      run: |
        python3 - <<'EOF'
        import json
        import re
        import sys

        pyproject_version = re.search(
            r'^version = "([^"]+)"', open("pyproject.toml").read(), re.MULTILINE
        ).group(1)
        server = json.load(open("server.json"))
        versions = {
            "pyproject.toml": pyproject_version,
            "server.json (top-level)": server["version"],
            "server.json (package)": server["packages"][0]["version"],
        }
        tag = "${{ github.ref_name }}".lstrip("v")
        versions["git tag"] = tag
        if len(set(versions.values())) != 1:
            print(f"Version mismatch: {versions}")
            sys.exit(1)
        print(f"All versions in sync: {pyproject_version}")
        EOF

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.12

    - name: Install uv
      run: |
        pip install uv

    - name: Install dependencies
      run: |
        uv sync --no-dev

    - name: Build a dist package
      run: uv build

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  publish-to-mcp-registry:
    name: Publish server.json to the official MCP registry
    runs-on: ubuntu-latest
    needs: build-n-publish
    steps:
    - uses: actions/checkout@v4

    - name: Check for registry signing key
      id: key
      run: |
        if [ -n "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::warning::MCP_REGISTRY_PRIVATE_KEY secret is not set; skipping MCP registry publish"
        fi

    - name: Wait for PyPI to serve the new version
      if: steps.key.outputs.present == 'true'
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        for i in $(seq 1 30); do
          if curl -sf "https://pypi.org/pypi/oxylabs-mcp/$VERSION/json" > /dev/null; then
            echo "PyPI serves $VERSION"
            exit 0
          fi
          sleep 10
        done
        echo "PyPI never served $VERSION" >&2
        exit 1

    - name: Install mcp-publisher
      if: steps.key.outputs.present == 'true'
      run: |
        curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
          | tar xz mcp-publisher
        sudo mv mcp-publisher /usr/local/bin/

    - name: Publish to MCP registry
      if: steps.key.outputs.present == 'true'
      run: |
        mcp-publisher login dns --domain oxylabs.io --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"
        mcp-publisher publish
